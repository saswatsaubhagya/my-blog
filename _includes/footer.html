<footer class="site-footer">
  <div class="wrapper">
    <div class="footer-content">
      <div class="footer-section">
        <h3 class="footer-heading">{{ site.title | escape }}</h3>
        <p class="footer-description">{{ site.description | escape }}</p>
      </div>

      <div class="footer-section">
        <h4 class="footer-heading">Connect</h4>
        <ul class="social-media-list">
          {%- if site.linkedin_username -%}
            <li>
              <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
              </a>
            </li>
          {%- endif -%}
          {%- if site.email -%}
            <li>
              <a href="mailto:{{ site.email }}">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
              </a>
            </li>
          {%- endif -%}
          <li>
            <a href="{{ "/feed.xml" | relative_url }}">
              <i class="fas fa-rss"></i>
              <span>RSS Feed</span>
            </a>
          </li>
        </ul>
      </div>


    </div>

    <div class="footer-bottom">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}. Built with <i class="fas fa-heart"></i> using Jekyll.</p>
    </div>
  </div>
</footer>
